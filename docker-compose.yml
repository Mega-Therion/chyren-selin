services:
  # ARCHON governance node — long-running HTTP server (selin serve).
  selin-archon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selin-archon
    depends_on:
      local-llm:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    environment:
      MODEL_ENDPOINT: http://local-llm:11434
      ADCCL_THRESHOLD: "0.7071"
    volumes:
      - selin_data:/data/selin
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # One-shot: pull the default model so the user doesn't have to `docker exec`.
  model-pull:
    image: ollama/ollama:latest
    depends_on:
      local-llm:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://local-llm:11434
      SELIN_MODEL: ${SELIN_MODEL:-deepseek-r1:1.5b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['echo "Pulling $${SELIN_MODEL}…"; ollama pull "$${SELIN_MODEL}"']
    restart: "no"

  # Local LLM node (Ollama) — serves the model endpoint.
  local-llm:
    image: ollama/ollama:latest
    container_name: selin-local-llm
    volumes:
      - ollama_storage:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  ollama_storage:
    name: ollama_storage
  selin_data:
    name: selin_data

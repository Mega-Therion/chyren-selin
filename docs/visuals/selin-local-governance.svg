<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">SELIN local-first governance boundary</title><desc id="desc">An editable diagram showing private local authority, bounded connectors, and auditable external actions.</desc>
<rect width="1600" height="900" fill="#07111f"/>
<g font-family="ui-sans-serif,system-ui,sans-serif"><text x="100" y="104" fill="#e7f0fa" font-size="38" font-weight="700">CHYREN SELIN</text><text x="100" y="142" fill="#91a9c2" font-size="20">Local-first authority • encrypted state • fail-closed actions</text></g>
<rect x="120" y="210" width="820" height="510" rx="28" fill="#0b2130" stroke="#42c9d7" stroke-width="4"/>
<text x="170" y="270" font-family="ui-sans-serif,system-ui,sans-serif" fill="#bdeff5" font-size="26" font-weight="700">LOCAL SOVEREIGN BOUNDARY</text>
<g font-family="ui-sans-serif,system-ui,sans-serif" fill="#eef7ff"><rect x="180" y="320" width="330" height="120" rx="16" fill="#122d40" stroke="#42c9d7" stroke-width="2"/><text x="215" y="375" font-size="24" font-weight="700">Encrypted state</text><text x="215" y="408" font-size="18" fill="#a9c6d5">memory • policy • keys</text><rect x="550" y="320" width="330" height="120" rx="16" fill="#1c2545" stroke="#8996ff" stroke-width="2"/><text x="585" y="375" font-size="24" font-weight="700">ARCHON runtime</text><text x="585" y="408" font-size="18" fill="#bbc5ff">evaluate • refuse • route</text><rect x="365" y="505" width="330" height="120" rx="16" fill="#173226" stroke="#60d394" stroke-width="2"/><text x="400" y="560" font-size="24" font-weight="700">Receipt ledger</text><text x="400" y="593" font-size="18" fill="#a8e9c2">trace • verify • replay</text></g>
<path d="M940 465H1120" stroke="#f2c14e" stroke-width="5"/><polygon points="1120,465 1088,447 1088,483" fill="#f2c14e"/>
<rect x="1140" y="320" width="320" height="290" rx="24" fill="#302417" stroke="#f2b84b" stroke-width="3"/><text x="1190" y="390" font-family="ui-sans-serif,system-ui,sans-serif" fill="#fff4d1" font-size="26" font-weight="700">BOUND CONNECTORS</text><text x="1190" y="440" font-family="ui-sans-serif,system-ui,sans-serif" fill="#ffd68c" font-size="20">Read only</text><text x="1190" y="480" font-family="ui-sans-serif,system-ui,sans-serif" fill="#ffd68c" font-size="20">Draft only</text><text x="1190" y="520" font-family="ui-sans-serif,system-ui,sans-serif" fill="#ffd68c" font-size="20">Write bounded</text><text x="1190" y="560" font-family="ui-sans-serif,system-ui,sans-serif" fill="#ffd68c" font-size="20">Receipt required</text>
<text x="100" y="830" font-family="ui-sans-serif,system-ui,sans-serif" fill="#91a9c2" font-size="18">No external side effect bypasses local policy, explicit capability bounds, and an auditable receipt.</text>
</svg>